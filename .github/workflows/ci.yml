name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the auto-merge bot re-run CI on main after it merges a PR.
  workflow_dispatch:

# The suite, linters and image build only read the repository.
permissions:
  contents: read

env:
  # Build and test on a Go release that still gets security fixes. The
  # module minimum (go.mod) stays at what the Stellar SDK requires.
  GO_VERSION: "1.26"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovault
          POSTGRES_PASSWORD: sorovault
          POSTGRES_DB: sorovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovault"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage gate tests the pull request's base commit in a
          # worktree, so its history must be present.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      # The version is pinned here and in the Makefile; keep the two equal so
      # `make lint` and CI cannot disagree about what a finding is.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Build
        run: go build ./...

      # Measure main before running the pull request's tests. Both runs use
      # the same throwaway Postgres, and the base schema is older, so running
      # it first avoids applying a newer migration underneath an older tree.
      - name: Baseline coverage from the base commit
        if: github.event_name == 'pull_request'
        env:
          CI: "true"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: |
          git worktree add "$RUNNER_TEMP/baseline" "$BASE_SHA"
          cd "$RUNNER_TEMP/baseline"
          go test -coverprofile=coverage.out -covermode=atomic ./...
          cp coverage.out "$GITHUB_WORKSPACE/coverage-base.out"

      # TEST_DATABASE_URL turns on the Postgres half of the store
      # conformance suite; without it those cases would silently skip.
      - name: Test
        env:
          CI: "true"
          TEST_DATABASE_URL: postgres://sorovault:sorovault@localhost:5432/sorovault?sslmode=disable
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Total and per-package coverage go to the job summary. On a pull
      # request the same script compares with the base run and fails if the
      # total drops by more than the stated margin.
      - name: Coverage report
        env:
          MAX_COVERAGE_DROP: "0.5"
        run: |
          if [ -f coverage-base.out ]; then
            .github/scripts/coverage.sh coverage.out coverage-base.out
          else
            .github/scripts/coverage.sh coverage.out
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The same suite on macOS and Windows, so path and line-ending assumptions
  # surface before a contributor on those systems hits them. Service
  # containers only run on Linux, so the Postgres half skips here; the job
  # above covers it.
  test-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        env:
          # TestPostgresIsExercised insists on a database whenever CI is set;
          # this job has none by design, and the Linux job enforces it.
          CI: ""
        run: go test ./...

  # The Go tests prove the generated client is stable; this proves it
  # compiles, strictly, against the SDK it targets.
  codegen-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/codegen/testdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the SDK and compiler
        run: npm install --no-audit --no-fund
      - name: Type-check the golden client
        run: npm run typecheck

  # Generating a package is one thing; proving npm accepts it and tsc builds
  # it is another. This regenerates the checked-in zkvote package and builds
  # it from scratch with the pinned toolchain.
  codegen-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Regenerate the zkvote package
        run: go test ./internal/codegen -run TestGoldenPackage -update
      - name: Fail if regeneration changed the checked-in package
        run: git diff --exit-code internal/codegen/testdata/zkvote-pkg
      - name: Install and build the package
        working-directory: internal/codegen/testdata/zkvote-pkg
        run: npm install --no-audit --no-fund && npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint chart
        run: helm lint deploy/helm/sorovault --set database.existingSecret=sorovault-db
      - name: Render chart
        run: helm template sorovault deploy/helm/sorovault --set database.existingSecret=sorovault-db

  # The Go tests prove openapi.json matches the router; this proves it is a
  # valid OpenAPI document that client generators will accept.
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint openapi.json
        run: npx --yes @redocly/cli@2.60.0 lint --extends=minimal internal/api/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t sorovault:ci .
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sorovault
      POSTGRES_PASSWORD: sorovault
      POSTGRES_DB: sorovault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorovault"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://sorovault:sorovault@db:5432/sorovault?sslmode=disable
      RPC_URL: ${RPC_URL:-https://soroban-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-0}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: